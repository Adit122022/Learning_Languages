<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone - Full Stack Social Media App</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        
        * {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        .story-ring {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 2px;
            border-radius: 50%;
        }

        .story-inner {
            background: white;
            padding: 2px;
            border-radius: 50%;
        }

        .gradient-border {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .instagram-gradient {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .post-image {
            aspect-ratio: 1/1;
            object-fit: cover;
        }

        .reel-video {
            height: calc(100vh - 60px);
            object-fit: cover;
        }

        .chat-bubble {
            max-width: 70%;
            word-wrap: break-word;
        }

        .notification-dot {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .liked {
            animation: likeAnimation 0.3s ease-in-out;
        }

        @keyframes likeAnimation {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        input[type="file"] {
            display: none;
        }

        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        @media (min-width: 768px) {
            .explore-grid {
                gap: 28px;
            }
            .profile-grid {
                gap: 28px;
            }
        }

        .typing-indicator span {
            animation: typingDot 1.4s infinite;
            opacity: 0;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingDot {
            0%, 60%, 100% { opacity: 0; }
            30% { opacity: 1; }
        }

        .story-progress {
            animation: storyProgress 5s linear forwards;
        }

        @keyframes storyProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Main App Container -->
    <div id="app"></div>

    <script>

                this.currentUser = null;

                this.stories = [];
                this.reels = [];

                this.messages = [];
                this.notifications = [];

            init() {
                // Load from localStorage
                const savedUser = localStorage.getItem('currentUser');
                const savedPosts = localStorage.getItem('posts');
                const savedUsers = localStorage.getItem('users');
                const savedStories = localStorage.getItem('stories');
                const savedReels = localStorage.getItem('reels');
                const savedMessages = localStorage.getItem('messages');
                const savedNotifications = localStorage.getItem('notifications');
                const savedSavedPosts = localStorage.getItem('savedPosts');

                if (savedUser) {
                    this.currentUser = JSON.parse(savedUser);
                    this.currentPage = 'home';
                }

                if (savedPosts) {
                    this.posts = JSON.parse(savedPosts);
                } else {
                    this.initializeSampleData();
                }

                if (savedUsers) {
                    this.users = JSON.parse(savedUsers);
                } else {
                    this.initializeSampleUsers();
                }

                if (savedStories) {
                    this.stories = JSON.parse(savedStories);
                } else {
                    this.initializeSampleStories();
                }

                if (savedReels) {
                    this.reels = JSON.parse(savedReels);
                } else {
                    this.initializeSampleReels();
                }

                if (savedMessages) {
                    this.messages = JSON.parse(savedMessages);
                } else {
                    this.messages = [];
                }

                if (savedNotifications) {
                    this.notifications = JSON.parse(savedNotifications);
                } else {
                    this.notifications = [];
                }

                if (savedSavedPosts) {
                    this.savedPosts = JSON.parse(savedSavedPosts);
                } else {
                    this.savedPosts = [];
                }

                    { id: 5, username: 'tech_guru', email: 'tech@example.com', password: 'password123', fullName: 'David Tech', bio: 'Software Engineer 💻\nCoding tutorials', avatar: 'https://i.pravatar.cc/150?img=13', followers: 12345, following: 234, posts: 156, isPrivate: false, isVerified: false }

                ];

            }

            initializeSampleReels() {
                this.reels = [

                        comments: 567,
                        plays: 123456,
                        timestamp: Date.now() - 172800000,
                        likedBy: []
                    }
                ];
                localStorage.setItem('reels', JSON.stringify(this.reels));
            }

            save() {
                localStorage.setItem('currentUser', JSON.stringify(this.currentUser));
                localStorage.setItem('posts', JSON.stringify(this.posts));
                localStorage.setItem('users', JSON.stringify(this.users));
                localStorage.setItem('stories', JSON.stringify(this.stories));
                localStorage.setItem('reels', JSON.stringify(this.reels));
                localStorage.setItem('messages', JSON.stringify(this.messages));
                localStorage.setItem('notifications', JSON.stringify(this.notifications));
                localStorage.setItem('savedPosts', JSON.stringify(this.savedPosts));
            }

            login(email, password) {
                const user = this.users.find(u => u.email === email && u.password === password);
                if (user) {
                    this.currentUser = user;
                    this.currentPage = 'home';
                    
                    // Initialize following relationships if not exists
                    if (!this.currentUser.followingIds) {
                        this.currentUser.followingIds = [1, 2, 3]; // Follow first 3 users by default
                    }
                    if (!this.currentUser.followerIds) {
                        this.currentUser.followerIds = [];
                    }
                    if (!this.currentUser.blockedIds) {
                        this.currentUser.blockedIds = [];
                    }
                    
                    this.save();
                    return true;
                }
                return false;
            }

            signup(email, password, username, fullName) {
                if (this.users.find(u => u.email === email || u.username === username)) {
                    return false;
                }
                const newUser = {
                    id: this.users.length + 1,
                    email,
                    password,
                    username,
                    fullName,
                    bio: '',
                    avatar: `https://i.pravatar.cc/150?img=${Math.floor(Math.random() * 70)}`,
                    followers: 0,
                    following: 0,
                    posts: 0,
                    isPrivate: false,
                    isVerified: false,
                    followingIds: [],
                    followerIds: [],
                    blockedIds: []
                };
                this.users.push(newUser);
                this.currentUser = newUser;
                this.currentPage = 'home';
                this.save();
                return true;
            }

            logout() {
                this.currentUser = null;
                this.currentPage = 'login';
                localStorage.removeItem('currentUser');
                this.save();
            }

            createPost(images, caption, location) {
                const newPost = {
                    id: this.posts.length + 1,
                    userId: this.currentUser.id,
                    username: this.currentUser.username,
                    userAvatar: this.currentUser.avatar,
                    images,
                    caption,
                    location,
                    likes: 0,
                    comments: [],
                    timestamp: Date.now(),
                    likedBy: []
                };
                this.posts.unshift(newPost);
                this.currentUser.posts++;
                this.save();
                return newPost;
            }

            likePost(postId) {
                const post = this.posts.find(p => p.id === postId);
                if (post) {
                    const index = post.likedBy.indexOf(this.currentUser.id);
                    if (index > -1) {
                        post.likedBy.splice(index, 1);
                        post.likes--;
                    } else {
                        post.likedBy.push(this.currentUser.id);
                        post.likes++;
                        // Add notification
                        if (post.userId !== this.currentUser.id) {
                            this.addNotification(post.userId, 'like', this.currentUser.id, postId);
                        }
                    }
                    this.save();
                }
            }

            addComment(postId, text) {
                const post = this.posts.find(p => p.id === postId);
                if (post) {
                    const newComment = {
                        id: Date.now(),
                        userId: this.currentUser.id,
                        username: this.currentUser.username,
                        text,
                        timestamp: Date.now()
                    };
                    post.comments.push(newComment);
                    this.save();
                    // Add notification
                    if (post.userId !== this.currentUser.id) {
                        this.addNotification(post.userId, 'comment', this.currentUser.id, postId);
                    }
                }
            }

            followUser(userId) {
                if (!this.currentUser.followingIds) this.currentUser.followingIds = [];
                const index = this.currentUser.followingIds.indexOf(userId);
                const user = this.users.find(u => u.id === userId);
                
                if (index > -1) {
                    this.currentUser.followingIds.splice(index, 1);
                    this.currentUser.following--;
                    if (user) {
                        user.followers--;
                        if (!user.followerIds) user.followerIds = [];
                        const followerIndex = user.followerIds.indexOf(this.currentUser.id);
                        if (followerIndex > -1) user.followerIds.splice(followerIndex, 1);
                    }
                } else {
                    this.currentUser.followingIds.push(userId);
                    this.currentUser.following++;
                    if (user) {
                        user.followers++;
                        if (!user.followerIds) user.followerIds = [];
                        user.followerIds.push(this.currentUser.id);
                        // Add notification
                        this.addNotification(userId, 'follow', this.currentUser.id);
                    }
                }
                this.save();
            }

            savePost(postId) {
                const index = this.savedPosts.indexOf(postId);
                if (index > -1) {
                    this.savedPosts.splice(index, 1);
                } else {
                    this.savedPosts.push(postId);
                }
                this.save();
            }

            sendMessage(toUserId, text, image = null) {
                const newMessage = {
                    id: Date.now(),
                    fromUserId: this.currentUser.id,
                    toUserId,
                    text,
                    image,
                    timestamp: Date.now(),
                    seen: false
                };
                this.messages.push(newMessage);
                this.save();
                // Add notification
                this.addNotification(toUserId, 'message', this.currentUser.id);
                return newMessage;
            }

            addNotification(toUserId, type, fromUserId, postId = null) {
                const notification = {
                    id: Date.now(),
                    toUserId,
                    fromUserId,
                    type, // 'like', 'comment', 'follow', 'message', 'mention', 'tag'
                    postId,
                    timestamp: Date.now(),
                    read: false
                };
                this.notifications.push(notification);
                this.save();
            }

            getUnreadNotifications() {
                return this.notifications.filter(n => n.toUserId === this.currentUser.id && !n.read);
            }

            markNotificationsAsRead() {
                this.notifications.forEach(n => {
                    if (n.toUserId === this.currentUser.id) {
                        n.read = true;
                    }
                });
                this.save();
            }
        }

        const state = new AppState();

        // ==================== COMPONENT RENDERER ====================
        function render() {
            const app = document.getElementById('app');
            
            if (!state.currentUser) {
                app.innerHTML = renderAuthPage();
            } else {
                app.innerHTML = renderMainApp();
            }
            
            attachEventListeners();
        }

        // ==================== AUTH PAGE ====================

        }

        function renderSignupForm() {
            return `
                <div id="authError" class="hidden mb-3 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
                <div id="authSuccess" class="hidden mb-3 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm"></div>
                
                <form onsubmit="handleSignup(event)" class="space-y-2">
                    <input type="email" id="signupEmail" placeholder="Email address" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-sm text-xs bg-gray-50 focus:outline-none focus:border-gray-400">
                    <input type="text" id="signupFullName" placeholder="Full Name" required minlength="2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-sm text-xs bg-gray-50 focus:outline-none focus:border-gray-400">
                    <input type="text" id="signupUsername" placeholder="Username" required minlength="3" pattern="[a-zA-Z0-9_]+"
                        class="w-full px-3 py-2 border border-gray-300 rounded-sm text-xs bg-gray-50 focus:outline-none focus:border-gray-400"

            return `
                <div class="bg-white border border-gray-300 rounded-lg mb-6">

                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="font-semibold text-sm cursor-pointer" onclick="viewUserProfile(${post.userId})">${post.username}</span>

                                </div>
                                ${post.location ? `<span class="text-xs text-gray-500">${post.location}</span>` : ''}
                            </div>
                        </div>
                        <button class="text-gray-700" onclick="showPostOptions(${post.id})">

                                `).join('')}
                            </div>
                            <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 flex gap-1">
                                ${post.images.map((_, idx) => `<div class="w-1.5 h-1.5 rounded-full bg-white opacity-60"></div>`).join('')}
                            </div>
                        ` : `
                            <img src="${post.images[0]}" class="post-image w-full" ondblclick="likePost(${post.id})">
                        `}
                    </div>
                    
                    <div class="p-3">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-4">
                                <button onclick="likePost(${post.id})" class="${isLiked ? 'text-red-500' : 'text-gray-700'}">

                                </button>
                                <button onclick="showComments(${post.id})" class="text-gray-700">
                                    <i class="far fa-comment text-2xl"></i>
                                </button>
                                <button onclick="sharePost(${post.id})" class="text-gray-700">
                                    <i class="far fa-paper-plane text-2xl"></i>
                                </button>
                            </div>
                            <button onclick="savePost(${post.id})" class="${isSaved ? 'text-black' : 'text-gray-700'}">
                                <i class="${isSaved ? 'fas' : 'far'} fa-bookmark text-2xl"></i>
                            </button>
                        </div>
                        
                        <div class="font-semibold text-sm mb-2">${post.likes.toLocaleString()} likes</div>
                        
                        <div class="text-sm mb-1">
                            <span class="font-semibold cursor-pointer" onclick="viewUserProfile(${post.userId})">${post.username}</span>
                            <span class="ml-2">${post.caption}</span>
                        </div>
                        
                        ${post.comments.length > 0 ? `
                            <button onclick="showComments(${post.id})" class="text-gray-500 text-sm">

                        <div class="text-xs text-gray-500 mt-1">${formatTimestamp(post.timestamp)}</div>
                    </div>
                    
                    <div class="border-t border-gray-200 p-3 flex items-center gap-3">

            return `

                            <div class="hidden md:flex md:w-2/3 items-center justify-center bg-white">

        // ==================== NOTIFICATIONS PAGE ====================
        function renderNotificationsPage() {
            state.markNotificationsAsRead();
            const notifications = state.notifications
                .filter(n => n.toUserId === state.currentUser.id)
                .sort((a, b) => b.timestamp - a.timestamp);

            return `
                <div class="md:pt-20 pt-4">
                    <div class="max-w-2xl mx-auto bg-white border border-gray-300 rounded-lg">
                        <div class="p-4 border-b border-gray-300">
                            <h2 class="text-xl font-semibold">Notifications</h2>
                        </div>
                        
                        <div class="divide-y divide-gray-200">
                            ${notifications.length === 0 ? `
                                <div class="p-12 text-center text-gray-500">
                                    <i class="far fa-heart text-6xl mb-4"></i>
                                    <p>No notifications yet</p>
                                </div>
                            ` : notifications.map(notif => renderNotification(notif)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderNotification(notif) {
            const fromUser = state.users.find(u => u.id === notif.fromUserId);
            if (!fromUser) return '';

            const messages = {
                like: 'liked your post',
                comment: 'commented on your post',
                follow: 'started following you',
                message: 'sent you a message',
                mention: 'mentioned you in a comment',
                tag: 'tagged you in a post'
            };

            const post = notif.postId ? state.posts.find(p => p.id === notif.postId) : null;

            return `
                <div class="p-4 flex items-center gap-3 hover:bg-gray-50">
                    <img src="${fromUser.avatar}" class="w-12 h-12 rounded-full object-cover cursor-pointer" onclick="viewUserProfile(${fromUser.id})">
                    <div class="flex-1">
                        <p class="text-sm">
                            <span class="font-semibold cursor-pointer" onclick="viewUserProfile(${fromUser.id})">${fromUser.username}</span>
                            <span class="text-gray-700"> ${messages[notif.type]}</span>
                        </p>
                        <p class="text-xs text-gray-500">${formatTimestamp(notif.timestamp)}</p>
                    </div>
                    ${post ? `<img src="${post.images[0]}" class="w-12 h-12 object-cover cursor-pointer" onclick="showPostDetail(${post.id})">` : ''}
                    ${notif.type === 'follow' ? `
                        <button onclick="followUser(${fromUser.id})" class="bg-blue-500 text-white px-4 py-1.5 rounded-lg text-sm font-semibold">
                            ${state.currentUser.followingIds?.includes(fromUser.id) ? 'Following' : 'Follow Back'}
                        </button>
                    ` : ''}
                </div>
            `;
        }

        // ==================== HELPER FUNCTIONS ====================
        function formatTimestamp(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
            if (seconds < 604800) return Math.floor(seconds / 86400) + 'd';
            return Math.floor(seconds / 604800) + 'w';
        }

        function getConversations() {
            const convMap = new Map();
            
            state.messages.forEach(msg => {
                const otherUserId = msg.fromUserId === state.currentUser.id ? msg.toUserId : msg.fromUserId;
                if (!convMap.has(otherUserId) || msg.timestamp > convMap.get(otherUserId).timestamp) {
                    convMap.set(otherUserId, msg);
                }
            });
            
            return Array.from(convMap.values()).map(msg => {
                const otherUserId = msg.fromUserId === state.currentUser.id ? msg.toUserId : msg.fromUserId;
                const user = state.users.find(u => u.id === otherUserId);
                return {
                    user,
                    lastMessage: msg.text || 'Photo',
                    timestamp: msg.timestamp,
                    seen: msg.seen || msg.fromUserId === state.currentUser.id
                };
            }).sort((a, b) => b.timestamp - a.timestamp);
        }

        window.showAuthMessage = function(message, type = 'success') {
            const errorDiv = document.getElementById('authError');
            const successDiv = document.getElementById('authSuccess');
            
            if (type === 'error') {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
            } else {

                successDiv.classList.remove('hidden');

        };

            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            
            btn.disabled = true;
            btn.textContent = 'Logging in...';

        window.handleSignup = function(e) {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const username = document.getElementById('signupUsername').value;
            const fullName = document.getElementById('signupFullName').value;
            const btn = document.getElementById('signupBtn');
            
            // Validation
            if (password.length < 6) {

                return;

            if (username.length < 3) {
                showAuthMessage('Username must be at least 3 characters long', 'error');

            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                showAuthMessage('Username can only contain letters, numbers, and underscores', 'error');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Creating account...';
